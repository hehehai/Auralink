# Release (docs/release.md): on a tag v0.x.y (a release) or v0.x.y-beta.n
# (a beta), build Auralink for Apple silicon on a macOS runner, sign it
# with the Developer ID, notarize it with the Apple ID's app-specific
# password, sign its update with the updater's key, and publish it on
# actnow.dev with the site's own script (scripts/actnow-publish.sh, a
# vendored copy of https://actnow.dev/actnow-publish.sh): it uploads the
# disk image, the update archive, the deltas and the manifest through the
# site's release API, whose back end checks them, stores them in R2 and
# publishes the version (the update feed https://actnow.dev/updates/auralink,
# betas …/beta, the changelog and the login-gated download). Installed apps
# see the update at their next check; betas only those with Beta updates
# on (MyGo patch 0006, updates.prereleases).
#
# - Run by hand (workflow_dispatch) it builds the same, signed and
#   notarized when the secrets are there (notarize off skips the
#   notarization), checks the build with the script's --dry-run, and keeps
#   the files as the run's artifacts; it publishes only from a tag with
#   dry_run off.
# - On a pull request that changes the release, it lints the workflows and
#   builds as far as it can without secrets (ad hoc, no notarization, no
#   update files), checks what it built and runs the script's --dry-run.
# - A publishing run without every secret fails at once, before building,
#   saying which secrets are missing.
#
# Actions are pinned to commits (the version in the comment).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check without publishing (from a tag, off publishes to actnow.dev)
        type: boolean
        default: true
      notarize:
        description: Notarize the build (a dry run may skip it, which saves its minutes)
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-helper.sh
      - scripts/release-config.sh
      - scripts/release-verify.sh
      - scripts/release-identity.sh
      - scripts/actnow-publish.sh
      - release/**
      - helper/Support/**
      - mygo.json

permissions: {}

# One release build of a ref at a time, never cancelled half way through a
# notarization or an upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: actionlint (with shellcheck)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      # The vendored copy of the site's publish script against the one the
      # site serves now: a warning, not a failure (docs/release.md, "the
      # publish script"), so that a change on the site is noticed.
      - name: actnow-publish.sh is the site's
        run: |
          if ! curl -fsSL --max-time 30 https://actnow.dev/actnow-publish.sh -o "$RUNNER_TEMP/actnow-publish.sh"; then
            echo "::warning::could not download https://actnow.dev/actnow-publish.sh to compare"
          elif ! cmp -s "$RUNNER_TEMP/actnow-publish.sh" scripts/actnow-publish.sh; then
            echo "::warning::scripts/actnow-publish.sh differs from https://actnow.dev/actnow-publish.sh (sha256 $(sha256sum "$RUNNER_TEMP/actnow-publish.sh" | cut -d' ' -f1)): review the change and update the copy (docs/release.md)"
          else
            echo "scripts/actnow-publish.sh is the site's ($(sha256sum scripts/actnow-publish.sh | cut -d' ' -f1))"
          fi

      - name: shellcheck the release scripts
        run: shellcheck scripts/release-config.sh scripts/release-verify.sh scripts/release-identity.sh scripts/build-helper.sh scripts/mac-update-e2e.sh scripts/mac-beta-e2e.sh

  release:
    needs: lint
    runs-on: macos-26
    # Publishing goes to actnow.dev with its own token: the job only reads
    # the repository.
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # Publish: a tag push, or a run by hand from a tag with dry_run off.
      # Pull requests never publish, nor see the secrets.
      UPLOAD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && !inputs.dry_run) }}
      NOTARIZE: ${{ github.event_name != 'workflow_dispatch' || inputs.notarize || (github.ref_type == 'tag' && !inputs.dry_run) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        run: |
          version="$(jq -r .version mygo.json)"
          helper="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' helper/Support/Info.plist)"
          echo "mygo.json $version, helper $helper, ref $GITHUB_REF_NAME ($GITHUB_REF_TYPE)"
          if [[ "$version" != "$helper" ]]; then
            echo "::error::helper/Support/Info.plist says $helper, mygo.json $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, the version in mygo.json"
            exit 1
          fi
          # The update window shows this section (docs/release.md: English, then Chinese).
          notes="$(awk -v v="$version" '/^## /{f = index($0, "[" v "]") || $2 == v; next} f' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" && "$UPLOAD" != true ]] && grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            # A dry run before the release: Unreleased stands for it (in
            # this checkout only; Clean up puts it back).
            echo "::notice::CHANGELOG.md has no section for $version yet: this dry run uses Unreleased"
            sed -i '' "s/^## \[Unreleased\]/## [$version] - $(date -u +%F)/" CHANGELOG.md
            notes="$(awk -v v="$version" '/^## /{f = index($0, "[" v "]") || $2 == v; next} f' CHANGELOG.md)"
          fi
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          if ! perl -CS -ne '$han = 1 if /\p{Han}/; END { exit !$han }' <<<"$notes"; then
            echo "::warning::the CHANGELOG.md section of $version has no Chinese: Chinese users see it in English"
          fi
          # A version with a pre-release part (0.1.0-beta.2) is a beta: the
          # beta channel, which only Beta updates offer.
          channel=stable
          if [[ "$version" == *-* ]]; then
            channel=beta
          fi
          echo "Channel: $channel"
          {
            echo "VERSION=$version"
            echo "CHANNEL=$channel"
          } >>"$GITHUB_ENV"

      - name: Check the secrets
        id: secrets
        env:
          MACOS_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_PASSWORD || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          ACTNOW_INGEST_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ACTNOW_INGEST_TOKEN || '' }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_PASSWORD MYGO_UPDATER_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          # Publishing: the site's token for Auralink's releases.
          if [[ "$UPLOAD" == true && -z "$ACTNOW_INGEST_TOKEN" ]]; then
            missing+=(ACTNOW_INGEST_TOKEN)
          fi
          if (( ${#missing[@]} == 0 )); then
            echo "signed=true" >>"$GITHUB_OUTPUT"
            echo "Every secret is set: a Developer ID build, notarized, with signed updates."
          elif [[ "$UPLOAD" == true ]]; then
            echo "::error::publishing needs the secrets ${missing[*]} (docs/release.md, one-time setup); nothing was built or uploaded"
            exit 1
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::notice::missing ${missing[*]}: an ad hoc build, without notarization or update files"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          go version

      - name: Fetch the family's cue sounds
        # React Bits Sound Lab's audio, from the ActNow family's private
        # library (never in this repository, NOTICE): with
        # ACTNOW_SOUNDS_TOKEN (a read-only token of hehehai/actnow-sounds)
        # the build carries them, without it (pull requests too) the app
        # plays macOS's system sounds.
        env:
          ACTNOW_SOUNDS_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ACTNOW_SOUNDS_TOKEN || '' }}
        run: |
          if [[ -z "$ACTNOW_SOUNDS_TOKEN" ]]; then
            echo "::warning::no ACTNOW_SOUNDS_TOKEN: this build plays system sounds"
            exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${ACTNOW_SOUNDS_TOKEN}@github.com/hehehai/actnow-sounds" "$RUNNER_TEMP/actnow-sounds"
          ACTNOW_SOUNDS="$RUNNER_TEMP/actnow-sounds" scripts/sync-sounds.sh
          rm -rf "$RUNNER_TEMP/actnow-sounds"

      - name: Signing keychain and notary credentials
        if: steps.secrets.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          umask 077
          # GitHub masks secrets already; these say so for every line below.
          echo "::add-mask::$APPLE_ID"
          echo "::add-mask::$APPLE_APP_PASSWORD"
          echo "::add-mask::$MACOS_CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$MACOS_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Searched first, before the user's other keychains.
          read -r -a others <<<"$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          # The Developer ID Application identity of the team, by its hash
          # (a name two certificates share is ambiguous to codesign).
          if ! found="$(scripts/release-identity.sh "$APPLE_TEAM_ID" "$keychain")"; then
            echo "::error::the certificate holds no Developer ID Application identity of the team in APPLE_TEAM_ID"
            exit 1
          fi
          IFS=$'\t' read -r identity name <<<"$found"
          # The notary service's credentials: the Apple ID and an
          # app-specific password of it. store-credentials checks them with
          # Apple before storing them, and prints neither (masked anyway).
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          {
            echo "NOTARY_KEYCHAIN=$keychain"
            echo "SIGN_IDENTITY=$identity"
          } >>"$GITHUB_ENV"
          echo "Signing as $name ($identity)"

      - name: Build the helper
        run: scripts/build-helper.sh

      - name: Release configuration
        run: |
          if [[ "${{ steps.secrets.outputs.signed }}" == true ]]; then
            scripts/release-config.sh --sign "$SIGN_IDENTITY" --notary-keychain "$NOTARY_KEYCHAIN"
          else
            echo "No updates nor signing identity: an ad hoc build of mygo.json as it is."
          fi
          jq '{version, identifier, macos: (.macos | {signingIdentity, notarize, entitlements, helperEntitlements}), updates}' mygo.json

      # Deltas come from the newest version of both channels on
      # actnow.dev (MyGo patch 0006).
      - name: Build${{ steps.secrets.outputs.signed == 'true' && env.NOTARIZE == 'true' && ' and notarize' || '' }}
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ steps.secrets.outputs.signed == 'true' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          args=(-platform darwin/arm64)
          if [[ "$NOTARIZE" != true ]]; then
            echo "::notice::not notarized (notarize off): a dry run only"
            args+=(-skip-notarize)
          fi
          go tool mygo build "${args[@]}"

      - name: Verify the app
        env:
          # The team the app must be signed by (Developer ID builds).
          EXPECT_TEAM: ${{ steps.secrets.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # Developer ID builds with notarize off (a dry run) are signed but
        # have no tickets: "unnotarized" checks all but Gatekeeper's.
        run: scripts/release-verify.sh build/darwin-arm64 "${{ steps.secrets.outputs.signed != 'true' && 'ad-hoc' || env.NOTARIZE == 'true' && 'developer-id' || 'unnotarized' }}"

      # The site's script finds the disk image, the archive, the deltas and
      # the manifest, checks the manifest points into this channel's feed,
      # takes the notes from CHANGELOG.md (English, and from the first
      # Chinese heading the Chinese) and, publishing, uploads them through
      # the release API; the back end checks sizes, hashes, the manifest,
      # the signatures and the notes, stores the files and publishes the
      # version, the manifest last. Otherwise --dry-run checks the same and
      # prints the request, sending nothing.
      - name: ${{ env.UPLOAD == 'true' && 'Publish to actnow.dev' || 'Publish to actnow.dev (dry run)' }}
        env:
          ACTNOW_INGEST_TOKEN: ${{ env.UPLOAD == 'true' && secrets.ACTNOW_INGEST_TOKEN || '' }}
        run: |
          args=(--app auralink --dir build/darwin-arm64 --changelog CHANGELOG.md --min-macos 15.0 --version "$VERSION")
          if [[ "$UPLOAD" != true ]]; then
            args+=(--dry-run)
          fi
          bash scripts/actnow-publish.sh "${args[@]}"

      # Every run keeps what it built, published or not: a publication
      # that failed can be sent again from it (docs/release.md).
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Auralink-${{ env.VERSION }}-darwin-arm64
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.tar.gz
            build/darwin-arm64/*.delta
            build/darwin-arm64/update-*.json
          if-no-files-found: error
          # A published version's files stay for a rollback (docs/release.md §5).
          retention-days: ${{ env.UPLOAD == 'true' && 90 || 7 }}

      - name: Summary
        if: env.UPLOAD == 'true'
        run: |
          {
            echo
            echo "Published Auralink $VERSION ($CHANNEL):"
            if [[ "$CHANNEL" == beta ]]; then
              echo "- feed: https://actnow.dev/updates/auralink/beta/update-darwin-arm64.json (Beta updates on)"
            else
              echo "- feed: https://actnow.dev/updates/auralink/update-darwin-arm64.json (everyone)"
            fi
            echo "- changelog: https://actnow.dev/auralink/changelog"
            echo "- download: https://actnow.dev/download/auralink"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          if [[ -n "${NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NOTARY_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/certificate.p12
          git checkout -- mygo.json CHANGELOG.md 2>/dev/null || true
