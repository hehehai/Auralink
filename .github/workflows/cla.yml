# The Contributor License Agreement (CLA.md), checked on every pull request
# by CLA Assistant Lite (contributor-assistant/github-action): authors of a
# pull request's commits who have not signed get a comment asking them to,
# and sign by replying with the sentence below. Signatures go into
# signatures/cla.json on the cla-signatures branch of this repository.
# The action does not make the branch, and fails when the file is missing,
# so both are made once by hand (an orphan branch with only that file):
#
#   git switch --orphan cla-signatures
#   mkdir -p signatures && printf '{\n  "signedContributors": []\n}\n' > signatures/cla.json
#   git add signatures/cla.json && git commit -m "cla: the signatures file"
#   git push origin cla-signatures && git switch main
#
# The branch must stay unprotected: the action commits to it with
# GITHUB_TOKEN.
#
# Security: pull_request_target and issue_comment run this file as it is on
# main, with a token that can write, also for pull requests from forks.
# That is safe because nothing here checks out or runs the pull request's
# code: the one step is the action, pinned to a commit, which reads the
# pull request's commits and comments through the API and writes the
# signatures file and its own comment. Do not add a checkout of the pull
# request's head to this workflow. The comment's text is only compared in
# `if`, never put in a shell.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-24.04
    # Pull requests, and comments on pull requests (not on issues) that sign
    # or ask for a recheck.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    # One check at a time per pull request (on the job, so that skipped
    # runs for other comments take no place). A newer one cancels a waiting
    # one, which loses nothing: every check reads all the comments.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write        # re-run the failed check of the pull request after a signature
      contents: write       # commit signatures/cla.json to the cla-signatures branch
      pull-requests: write  # comment on the pull request; lock it once merged
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/hehehai/Auralink/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The owner, and bots that cannot sign. Exact names, no wildcard:
          # anyone can name a GitHub App "something[bot]".
          allowlist: hehehai,dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, every author of its
            commits signs the [Auralink Contributor License Agreement](https://github.com/hehehai/Auralink/blob/main/CLA.md)
            (you keep your copyright; [CONTRIBUTING.md](https://github.com/hehehai/Auralink/blob/main/CONTRIBUTING.md)
            explains it). To sign, reply to this pull request with a comment that reads exactly the sentence below.<br/>
            感谢你的 PR。合并前，每个提交的作者都要签署 Auralink 贡献者许可协议（版权仍归你，CLA.md 末尾有中文说明）：回复一条评论，内容为下面这句英文。
          custom-allsigned-prcomment: All authors have signed the CLA. 所有作者都已签署 CLA。
          signed-commit-message: "cla: $contributorName signed the CLA in $owner/$repo"
          create-file-commit-message: "cla: create the signatures file"
          lock-pullrequest-aftermerge: true
