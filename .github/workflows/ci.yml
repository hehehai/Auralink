# CI (AudioSmith's), two jobs:
# - go (Linux): the Go side (views in ui.Tester, the store, settings, the
#   helper supervisor against the fake helper, the protocol fixtures, i18n
#   key parity) and MyGo's vet.
# - helper (macOS): the Swift helper's tests (swift test, against
#   helper/Fixtures), its release build, and the Go tests that decode the
#   same fixtures, so both sides of the helper protocol are checked on a Mac.
# What needs permissions or a GUI (the event tap, Accessibility, the
# microphone) is checked by hand: docs/manual-test.md.
#
# Actions are pinned to commits (the version in the comment), as in
# release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # The release the CJK fonts' package below is from.
    runs-on: ubuntu-24.04
    env:
      # The MyGo SQLite plugin loads a prebuilt library. Tests would download
      # it on first use; CI fetches it once, checks its sha256 against the
      # plugin's manifest and points the plugin at it.
      SQLITE_ASSET: mygo-sqlite3-linux-amd64.so
      # Pango draws Chinese with what fontconfig finds, and the runner has
      # no CJK font: the overlay's ink checks of Chinese text saw nothing.
      # It gets the CJK fonts a dev machine (Ubuntu 24.04) has, so that the
      # snapshots come out the same: fonts-noto-cjk, and fonts-droid-fallback,
      # which fontconfig puts first for text without a language. Pool paths
      # and sha256 pinned, the files cached.
      FONT_DEBS: |
        f/fonts-noto-cjk/fonts-noto-cjk_20230817+repack1-3_all.deb 7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
        f/fonts-android/fonts-droid-fallback_6.0.1r16-1.1build1_all.deb 353e093dd32677e48edbdc9c94c4e92db0e80763fc326ddec1ba8281d8553a5e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: SQLite library for the MyGo plugin
        id: sqlite
        run: |
          dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/sqlite"
          read -r url sum < <(jq -r '.libraries[0].files["linux-amd64"] | "\(.url) \(.sha256)"' "$dir/mygo-plugin.json")
          echo "sha=$sum" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sqlite-cache
        with:
          path: ~/.cache/mygo-ci/sqlite
          key: mygo-sqlite-${{ steps.sqlite.outputs.sha }}

      - name: Fetch and verify the SQLite library
        run: |
          mkdir -p ~/.cache/mygo-ci/sqlite
          lib=~/.cache/mygo-ci/sqlite/libmygo-sqlite3.so
          if [ ! -f "$lib" ]; then
            curl -fsSL --retry 3 -o "$lib" "${{ steps.sqlite.outputs.url }}"
          fi
          echo "${{ steps.sqlite.outputs.sha }}  $lib" | sha256sum -c -
          echo "MYGO_SQLITE_LIBRARY=$lib" >> "$GITHUB_ENV"

      - name: Font packages' cache key
        id: fonts
        run: echo "key=fonts-$(printf '%s' "$FONT_DEBS" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-fonts
          key: ${{ steps.fonts.outputs.key }}

      - name: CJK fonts
        run: |
          mkdir -p ~/.cache/ci-fonts
          debs=()
          while read -r path sum; do
            [ -n "$path" ] || continue
            deb=~/.cache/ci-fonts/"$(basename "$path")"
            if [ ! -f "$deb" ]; then
              curl -fsSL --retry 3 -o "$deb" "http://archive.ubuntu.com/ubuntu/pool/main/$path"
            fi
            echo "$sum  $deb" | sha256sum -c -
            debs+=("$deb")
          done <<< "$FONT_DEBS"
          sudo dpkg -i "${debs[@]}"
          fc-cache -f
          fc-match -s sans-serif | head -5
          fc-list :lang=zh family | sort

      - name: gofmt
        run: |
          bad="$(git ls-files -z '*.go' ':!:third_party/**' | xargs -0 gofmt -l)"
          if [ -n "$bad" ]; then
            echo "::error::not gofmt-ed (run gofmt -w): $bad"
            exit 1
          fi

      # -count=1 everywhere: setup-go's cache holds the last run's test
      # results too, and a test's result does not change with what it
      # does not see (the fonts, a flake): without it, a run after a green
      # one only said "(cached)".
      - name: Test
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Race
        run: CGO_ENABLED=1 go test -count=1 -race ./...

      - name: MyGo vet
        run: go tool mygo vet .

      - name: Vet the demo and update-check builds
        run: |
          go vet -tags demo ./...
          go vet -tags updatecheck .

      - name: Snapshots
        run: |
          AURALINK_SNAPSHOTS="$RUNNER_TEMP/shots" go test -count=1 -run TestSnapshots .
          find "$RUNNER_TEMP/shots" -name '*.png' | wc -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: ${{ runner.temp }}/shots
          retention-days: 7

  helper:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Swift tests
        working-directory: helper
        run: swift test

      - name: Release build (ad hoc signed)
        run: scripts/build-helper.sh --out "$RUNNER_TEMP/helper"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go protocol fixtures and supervisor
        run: CGO_ENABLED=0 go test -count=1 ./internal/helper/...
